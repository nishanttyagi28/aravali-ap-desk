name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Export schemas up to date
        run: |
          python scripts/export_schemas.py
          git diff --exit-code schemas/
      - name: Pytest
        run: pytest -q
      - name: Synthetic generator smoke
        run: python -m datasets.synth --n 50 --seed 7 --out datasets/generated

  frozen-files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check frozen paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          frozen = [
              "schemas",
              "openapi.yaml",
              "pyproject.toml",
              "AGENTS.md",
              ".cursor",
              "docai/contracts",
              "docai/__init__.py",
              "scripts",
          ]
          base, head = os.environ["BASE"], os.environ["HEAD"]
          out = subprocess.check_output(
              ["git", "diff", "--name-only", base, head], text=True
          )
          changed = [p.strip() for p in out.splitlines() if p.strip()]
          hits = []
          for path in changed:
              norm = path.replace("\\", "/")
              for f in frozen:
                  fn = f.replace("\\", "/").strip("/")
                  if norm == fn or norm.startswith(fn + "/"):
                      hits.append(path)
                      break
          if not hits:
              sys.exit(0)
          labels = os.environ.get("PR_LABELS", "")
          if "contract-change" in labels:
              sys.exit(0)
          print("Frozen files changed without contract-change label:")
          for h in hits:
              print(" ", h)
          sys.exit(1)
          PY
